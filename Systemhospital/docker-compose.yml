version: '3.8'

services:
  # Căn nhà số 1: Lưu trữ dữ liệu (Đã cấu hình giữ lại dữ liệu an toàn)
  postgres:
    image: postgres:15
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mcn12345
      POSTGRES_DB: mcn_db
    volumes:
      - ../Docker_Data/postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mcn.com
      PGADMIN_DEFAULT_PASSWORD: mcn12345
    depends_on:
      - postgres

  # Căn nhà số 2: Bộ nhớ đệm (làm mượt hệ thống)
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Căn nhà số 3: Hệ thống xếp hàng tin nhắn
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
